name: Bootstrap Android Source

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/kfp-source.tar.gz
          echo "90ea63cf0695542fc9b2a54451c1319d093b7c3b21d41f641eea38e3c9fff0e1  /tmp/kfp-source.tar.gz" | sha256sum -c -

      - name: Import Android project
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .bootstrap \
            ! -name .github \
            -exec rm -rf {} +
          tar -xzf /tmp/kfp-source.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Android native source"
          git push origin HEAD:main
