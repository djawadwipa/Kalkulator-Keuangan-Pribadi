name: Fix Repository Reference

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-repository-reference.yml"

permissions:
  contents: write

jobs:
  fix-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Align repository references and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Kalkulator-Keuangan-Pribadi-Android/Kalkulator-Keuangan-Pribadi/g' \
            PROJECT_STATUS.md \
            app/src/main/java/id/djawadwipa/kalkulatorkeuangan/ui/FinanceApp.kt
          rm -f .github/workflows/fix-repository-reference.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align repository references"
          git push origin HEAD:main
