name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap checksum-verified Gradle Wrapper
        run: ./scripts/bootstrap-gradle-wrapper.sh

      - name: Set up Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Validate signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Restore private release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Test, lint, build signed APK and AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:clean :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Generate release dependency report
        run: ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > dependency-report-release.txt

      - name: Verify release properties
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          test "$(apkanalyzer manifest application-id "$APK")" = "id.djawadwipa.kalkulatorkeuangan"
          test "$(apkanalyzer manifest debuggable "$APK")" = "false"
          if apkanalyzer manifest print "$APK" | grep -q '<uses-permission'; then
            echo "Unexpected Android permission found in release APK" >&2
            exit 1
          fi
          apksigner verify --verbose --print-certs "$APK"
          jarsigner -verify -strict "$AAB"

      - name: Create SHA-256 checksums
        run: |
          cd app/build/outputs
          sha256sum apk/release/app-release.apk bundle/release/app-release.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kalkulator-keuangan-pribadi-release
          retention-days: 30
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/SHA256SUMS.txt
            app/build/reports/lint-results-release.*
            app/build/reports/tests/testDebugUnitTest/
            dependency-report-release.txt
